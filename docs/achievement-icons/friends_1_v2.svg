<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <radialGradient id="h1" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.25" stop-color="#FFC4E4"/><stop offset="0.65" stop-color="#FF6FB8"/><stop offset="1" stop-color="#C2187A"/></radialGradient>
  <radialGradient id="h2" cx="0.35" cy="0.3" r="0.85"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.3" stop-color="#F3D2FF"/><stop offset="0.7" stop-color="#C08BFF"/><stop offset="1" stop-color="#7A3FD6"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4FB0"/><stop offset="0.5" stop-color="#FFB3DE"/><stop offset="1" stop-color="#D23A9A"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF7CC4" stop-opacity="0.55"/><stop offset="1" stop-color="#FF7CC4" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5A1046" flood-opacity="0.35"/></filter>
  <path id="heart" d="M0,40 C-60,-30 -150,10 -120,90 C-100,140 -40,175 0,215 C40,175 100,140 120,90 C150,10 60,-30 0,40 Z"/>
</defs>
<circle cx="256" cy="262" r="230" fill="url(#glow)"/>
<!-- back of the ring -->
<ellipse cx="256" cy="282" rx="210" ry="62" fill="none" stroke="url(#rim)" stroke-width="12" transform="rotate(-14 256 282)" opacity="0.55"/>
<!-- back heart -->
<g filter="url(#shadow)" transform="translate(296 150) rotate(12) scale(0.95)">
  <use href="#heart" fill="url(#h2)"/>
  <ellipse cx="-62" cy="40" rx="32" ry="20" fill="#FFFFFF" opacity="0.7" filter="url(#soft)" transform="rotate(-35 -62 40)"/>
</g>
<!-- front heart -->
<g filter="url(#shadow)" transform="translate(212 178) rotate(-10)">
  <use href="#heart" fill="url(#h1)"/>
  <ellipse cx="-64" cy="42" rx="36" ry="22" fill="#FFFFFF" opacity="0.85" filter="url(#soft)" transform="rotate(-35 -64 42)"/>
  <ellipse cx="60" cy="150" rx="40" ry="14" fill="#FFFFFF" opacity="0.25" filter="url(#soft)" transform="rotate(-40 60 150)"/>
</g>
<!-- front of the ring -->
<path d="M52,326 A210,62 -14 0 0 462,224" fill="none" stroke="url(#rim)" stroke-width="12" stroke-linecap="round" transform="rotate(0)"/>
<!-- sparkles -->
<g fill="#FF5FC0">
  <path transform="translate(96 150) scale(1.3)" d="M0,-14 C2,-3 3,-2 14,0 C3,2 2,3 0,14 C-2,3 -3,2 -14,0 C-3,-2 -2,-3 0,-14 Z"/>
  <path transform="translate(420 120)" d="M0,-14 C2,-3 3,-2 14,0 C3,2 2,3 0,14 C-2,3 -3,2 -14,0 C-3,-2 -2,-3 0,-14 Z"/>
  <path transform="translate(440 380) scale(1.1)" d="M0,-14 C2,-3 3,-2 14,0 C3,2 2,3 0,14 C-2,3 -3,2 -14,0 C-3,-2 -2,-3 0,-14 Z"/>
  <path transform="translate(120 420) scale(0.8)" d="M0,-14 C2,-3 3,-2 14,0 C3,2 2,3 0,14 C-2,3 -3,2 -14,0 C-3,-2 -2,-3 0,-14 Z"/>
</g>
<circle cx="380" cy="80" r="6" fill="#FFE27A"/><circle cx="70" cy="300" r="5" fill="#7FE0FF"/>
</svg>
