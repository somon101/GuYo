<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Golos Text",sans-serif;background:#0e1014;color:#f5f5f5}
header{display:flex;align-items:center;gap:26px;padding:20px 36px}
header b{font-size:22px;color:#ffcc33}
header a{color:#9aa0ad;font-size:15px}header a.on{color:#fff;font-weight:600}
.row{padding:8px 36px 18px}
.row h2{font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.row h2 span{font-size:13px;color:#9aa0ad;font-weight:400}
.tiles{display:flex;gap:12px}
.t{width:190px;height:120px;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:600}
.t.big{width:300px;height:150px;outline:3px solid #5862dd;outline-offset:2px}
.t.big small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:4px}
.dim .t{opacity:.45}
</style></head><body>
<header><b>GuYo</b><a>Пользователи</a><a class="on">Контент</a><a>Игра</a><a>Доход</a><a>Цифры</a></header>
<section class="row"><h2>Достижения<span>24 · 3 в архиве</span></h2><div class="tiles">
<div class="t big" style="background:linear-gradient(160deg,#c9a227,#6b4d00)">10 дней подряд<small>получили 312 · серия</small></div>
<div class="t" style="background:linear-gradient(160deg,#2e7d5b,#103a2a)">Первые 50 слов</div>
<div class="t" style="background:linear-gradient(160deg,#5862dd,#232a7a)">Друг GuYo</div>
<div class="t" style="background:linear-gradient(160deg,#b0413e,#4d1514)">Квест-мастер</div>
<div class="t" style="background:linear-gradient(160deg,#3d5a80,#16233a)">100 фраз</div></div></section>
<section class="row dim"><h2>Языки<span>4</span></h2><div class="tiles">
<div class="t" style="background:#203a55">Русский · 748 слов</div><div class="t" style="background:#3b2f55">Английский · 512</div><div class="t" style="background:#2f4a3a">Китайский · 120</div><div class="t" style="background:#4a3a2a">Узбекский · 0</div></div></section>
<section class="row dim"><h2>Мини-фразы<span>61 · 3 шаблона</span></h2><div class="tiles">
<div class="t" style="background:#2a2f3a">Кто + что делает</div><div class="t" style="background:#2a2f3a">Где + что</div><div class="t" style="background:#2a2f3a">Какой + кто</div></div></section>
</body></html>
