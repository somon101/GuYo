<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5560E0">
<title>Студия аватаров</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></i>Студия аватаров</div>
    <div class="sp"></div>
    <div class="saved" id="saved"><b></b><span id="savedTxt">Сохранено</span></div>
    <div class="seg" id="th"><button data-t="light">Светлая</button><button data-t="dark">Тёмная</button></div>
    <button class="btn" id="openPv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2.4 3-3.5 5.5-3.5s4.3 1.1 5.5 3.5"/></svg><span class="lbl">В профиле</span></button>
    <button class="btn pri" id="exPng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg><span class="lbl">Скачать PNG</span></button>
  </div>

  <div class="grid">
    <div class="c-left">
      <div class="card" data-t="layers">
        <h2>Наборы</h2>
        <div class="sets" id="sets"></div>
        <div class="setrow"><input id="setName" aria-label="Название набора"><button class="mini" id="setDel" title="Удалить набор">Удалить</button></div>
        <p class="note">Набор это комплект деталей: одежда, лица, волосы, очки, фоны. Положение слотов общее, поэтому деталь из другого набора встаёт на то же место.</p>
      </div>
      <div class="card" data-t="layers">
        <h2>Слоты, снизу вверх</h2>
        <div class="slots" id="slots"></div>
        <div class="newslot"><input id="newSlot" placeholder="Новый слот, например «Шапка»" aria-label="Название нового слота"><button class="btn" id="addSlot">Добавить</button></div>
      </div>
    </div>

    <div class="c-stage">
      <div class="stagewrap" id="stage">
        <svg id="st" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Собранный аватар"></svg>
        <div class="empty-note" id="emptyNote"><div><b style="color:var(--ink);font-size:17px">Макет пустой</b><br>Выберите слот слева и загрузите первую деталь справа.</div></div>
        <div class="tools">
          <button class="btn" id="place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span class="lbl">Указать точку кликом</span></button>
          <button class="btn" id="frameTool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg><span class="lbl">Кадр профиля</span></button>
        </div>
        <div class="hint"><span id="selInfo"></span><span class="coord" id="cur">x —  y —</span></div>
      </div>
      <div class="tabs" id="tabs"><button data-tab="layers" class="on">Слои</button><button data-tab="parts">Детали</button><button data-tab="pos">Положение</button><button data-tab="profile">Кадр</button><button data-tab="looks">Аватарки</button></div>
    </div>

    <div class="c-right">
      <div class="card" id="parts" data-t="parts"></div>
      <div class="card" id="geo" data-t="pos"></div>
      <div class="card" id="frame" data-t="profile"></div>
    </div>
  </div>

  <div class="below">
    <div class="card" id="looks" data-t="looks"></div>
    <div class="card" id="project" data-t="looks"></div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Как это выглядит в профиле"><div class="sheet" id="sheet"></div></div>
<div class="busy" id="busy">Обработка…</div>
<input type="file" id="openFile" accept=".json,application/json" hidden>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="lib"></defs></svg>
<script src="core.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
