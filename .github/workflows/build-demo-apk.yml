name: Build Demo APK

# A demo of the app on made-up data (no server needed). It has its own package name
# (com.guyo.guyo_app.demo) and label, so it installs NEXT TO the real app and never touches
# its data. Manual only. Result: Releases -> "GuYo Demo APK" (tag apk-demo) -> GuYo-Demo.apk.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GUYO_APP_ID: com.guyo.guyo_app.demo
      GUYO_APP_LABEL: GuYo Demo
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Signing key (the same as the real app's, so it stays installable)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Let the Firebase config know the demo package
        run: |
          python3 - <<'PY'
          import json, copy
          p = "android/app/google-services.json"
          d = json.load(open(p))
          c = copy.deepcopy(d["client"][0])
          c["client_info"]["android_client_info"]["package_name"] = "com.guyo.guyo_app.demo"
          c["client_info"]["mobilesdk_app_id"] = c["client_info"]["mobilesdk_app_id"][:-4] + "demo"
          d["client"].append(c)
          json.dump(d, open(p, "w"), indent=2)
          PY

      - run: flutter pub get

      - name: Build
        run: flutter build apk --release --split-per-abi -t lib/main_demo.dart

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk GuYo-Demo.apk
          gh release delete apk-demo --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-demo GuYo-Demo.apk --title "GuYo Demo APK" --prerelease \
            --notes "Demo on made-up data, no server needed. Installs next to the real app." \
            --target "${GITHUB_SHA}"
