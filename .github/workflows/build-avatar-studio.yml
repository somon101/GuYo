name: Build Avatar Studio

# Отдельная офлайн-программа «Студия аватаров» (папка avatar_studio, Flutter). Не связана с приложением GuYo.
# Запускается только вручную. Результат: Releases -> "Avatar Studio" (тег avatar-studio):
# AvatarStudio.apk (Android), Avatar-Studio-Setup.exe (установщик для Windows) и
# Avatar-Studio-Windows.zip (та же программа без установки: распаковать и запустить avatar_studio.exe).
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: avatar_studio

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Подпись APK (отпечаток должен быть одним и тем же у всех сборок)
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-apk
          path: avatar_studio/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Библиотеки Visual C++ рядом с программой (чтобы запускалась на любом ПК)
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" build/windows/x64/runner/Release/ -Force
          }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Avatar-Studio-Windows.zip
      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value) + ".${{ github.run_number }}"
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\build\windows\x64\runner\Release" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-windows
          path: |
            avatar_studio/Avatar-Studio-Windows.zip
            avatar_studio/build/installer/Avatar-Studio-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp out/AvatarStudio-apk/app-release.apk AvatarStudio.apk
          cp out/AvatarStudio-windows/Avatar-Studio-Windows.zip Avatar-Studio-Windows.zip
          cp "$(find out/AvatarStudio-windows -name Avatar-Studio-Setup.exe)" Avatar-Studio-Setup.exe
          gh release delete avatar-studio --yes --cleanup-tag 2>/dev/null || true
          gh release create avatar-studio AvatarStudio.apk Avatar-Studio-Setup.exe Avatar-Studio-Windows.zip --title "Avatar Studio" --prerelease \
            --target "${{ github.sha }}" \
            --notes "Студия аватаров на Flutter: Android (APK) и Windows (Avatar-Studio-Setup.exe: установщик; zip: без установки, распаковать и запустить avatar_studio.exe). Работает офлайн, не зависит от GuYo."
