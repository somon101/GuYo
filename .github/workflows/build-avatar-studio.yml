name: Build Avatar Studio

# Отдельная офлайн-программа «Студия аватаров» (папка avatar_studio, Flutter). Не связана с приложением GuYo.
# Запускается только вручную. Результат: Releases -> "Avatar Studio" (тег avatar-studio):
# AvatarStudio.apk (Android) и Avatar-Studio-Windows.zip (Windows: распаковать и запустить avatar_studio.exe).
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: avatar_studio

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Подпись APK (отпечаток должен быть одним и тем же у всех сборок)
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-apk
          path: avatar_studio/build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Avatar-Studio-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-windows
          path: avatar_studio/Avatar-Studio-Windows.zip

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp out/AvatarStudio-apk/app-release.apk AvatarStudio.apk
          cp out/AvatarStudio-windows/Avatar-Studio-Windows.zip Avatar-Studio-Windows.zip
          gh release delete avatar-studio --yes --cleanup-tag 2>/dev/null || true
          gh release create avatar-studio AvatarStudio.apk Avatar-Studio-Windows.zip --title "Avatar Studio" --prerelease \
            --notes "Студия аватаров на Flutter: Android (APK) и Windows (zip: распаковать и запустить avatar_studio.exe). Работает офлайн, не зависит от GuYo."
