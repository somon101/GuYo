name: Build Avatar Studio

# Отдельная офлайн-программа «Студия аватаров» (папка avatar-studio). Не связана с приложением GuYo.
# Запускается только вручную. Результат: Releases -> "Avatar Studio" (тег avatar-studio):
# AvatarStudio.apk (Android) и Avatar-Studio.exe (Windows, запускается без установки).
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: avatar-studio

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/core.test.js

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - name: Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: avatar-studio/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-apk
          path: avatar-studio/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-exe
          path: avatar-studio/dist/Avatar-Studio.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp out/AvatarStudio-apk/app-debug.apk AvatarStudio.apk
          cp out/AvatarStudio-exe/Avatar-Studio.exe Avatar-Studio.exe
          gh release delete avatar-studio --yes --cleanup-tag 2>/dev/null || true
          gh release create avatar-studio AvatarStudio.apk Avatar-Studio.exe --title "Avatar Studio" --prerelease \
            --notes "Студия аватаров: Android (APK) и Windows (exe без установки). Работает офлайн, не зависит от GuYo."
