name: Build Android APK

# Builds the release APK and attaches it to the run (Actions -> this
# workflow -> a run -> Artifacts -> guyo-apk).
#
# Set once in the repository (Settings -> Secrets and variables -> Actions):
# - variable API_BASE_URL: the backend address, e.g. https://api.example.com
# - secret ANDROID_DEBUG_KEYSTORE_BASE64: your computer's debug keystore
#   (~/.android/debug.keystore) as base64. The app is signed with it, so
#   its SHA-1 -- the one registered for Google sign-in -- stays the same.
#   Without it a fresh key is used and "Войти через Google" won't work.
on:
  push:
    branches: [claude/kind-ramanujan-8hw2as, main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Use the registered signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the provided key"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 not set: Google sign-in will not work in this APK"
          fi

      - run: flutter pub get

      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://backend-production-cda3.up.railway.app' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "::error::Set the repository variable API_BASE_URL"; exit 1; fi
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1|SHA-1" || true

      - uses: actions/upload-artifact@v4
        with:
          name: guyo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
